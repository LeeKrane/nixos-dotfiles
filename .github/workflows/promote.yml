name: promote

# Separate from check.yml: update.yml calls that with read-only permissions, and a called job asking for write access would void the caller.
on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history, so origin/main and origin/deploy are both known locally.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # deploy follows main (force-pushes included) but moves only to main's current head: older runs skip, so deploy never moves backwards.
      # The lease fails the push if deploy changed since it was read.
      - name: Move deploy to main's head
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --quiet origin main deploy || git fetch --quiet origin main
          main_head="$(git rev-parse origin/main)"
          if [ "$HEAD_SHA" != "$main_head" ]; then
            echo "$HEAD_SHA is no longer main's head ($main_head); its own run promotes it."
            exit 0
          fi
          old="$(git rev-parse --quiet --verify origin/deploy || true)"
          git push --force-with-lease="refs/heads/deploy:$old" origin "${HEAD_SHA}:refs/heads/deploy"
