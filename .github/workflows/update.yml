name: update

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# A manual run queues behind a scheduled one instead of racing it on the branch.
concurrency:
  group: update
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Package versions before update
        run: |
          nix eval --json --impure '.#nixosConfigurations' \
            --apply 'import ./scripts/update-versions.nix' > "$RUNNER_TEMP/versions-before.json"
      - name: Save old flake.lock
        run: cp flake.lock "$RUNNER_TEMP/flake.lock.old"
      - name: Update inputs and claude-code
        run: |
          set -o pipefail
          nix flake update 2>&1 | tee "$RUNNER_TEMP/update.log"
          scripts/update-claude-code.sh 2>&1 | tee -a "$RUNNER_TEMP/update.log"
      - name: Check for changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- flake.lock pkgs/claude-code)" ]; then
            echo "Nothing to update."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Package versions after update
        if: steps.diff.outputs.changed == 'true'
        run: |
          nix eval --json --impure '.#nixosConfigurations' \
            --apply 'import ./scripts/update-versions.nix' > "$RUNNER_TEMP/versions-after.json"
      - name: Render summary
        if: steps.diff.outputs.changed == 'true'
        run: |
          scripts/update-summary.sh "$RUNNER_TEMP/flake.lock.old" flake.lock \
            "$RUNNER_TEMP/versions-before.json" "$RUNNER_TEMP/versions-after.json" \
            "$RUNNER_TEMP/update.log" > "$RUNNER_TEMP/summary.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.diff.outputs.changed == 'true'
        with:
          name: update-summary
          path: ${{ runner.temp }}/summary.md
          retention-days: 7
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.lock pkgs/claude-code
          git commit -m 'Update flake inputs and claude-code'
          git push --force origin HEAD:refs/heads/ci/flake-update

  check:
    needs: update
    if: needs.update.outputs.changed == 'true'
    # A called workflow gets at most what its caller grants; check.yml's nvim
    # job asks for pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/check.yml
    with:
      ref: ci/flake-update
      force-nvim: true

  # Report-only: a vulnix CVE diff and a local-build count per host, never
  # gating the PR. ci/flake-update is main plus one commit (update's "Commit
  # and push" force-pushes it there), so its HEAD~1 is the pre-update base.
  security:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      critical: ${{ steps.summary.outputs.critical }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/flake-update
          fetch-depth: 2
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Evaluate toplevel derivations before and after
        run: |
          # shellcheck disable=SC2016 # ${h} is Nix antiquotation, not a shell variable
          apply='cfgs: builtins.listToAttrs (map (h: { name = h; value = cfgs.${h}.config.system.build.toplevel.drvPath; }) ["taractias" "tariognatha" "tarmantria"])'
          git checkout HEAD~1 -- flake.lock pkgs/claude-code
          nix eval --json --impure '.#nixosConfigurations' --apply "$apply" > "$RUNNER_TEMP/drvs-before.json"
          git checkout HEAD -- flake.lock pkgs/claude-code
          nix eval --json --impure '.#nixosConfigurations' --apply "$apply" > "$RUNNER_TEMP/drvs-after.json"
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache vulnix's NVD database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/vulnix
          key: vulnix-nvd-${{ steps.week.outputs.week }}
          restore-keys: |
            vulnix-nvd-
      - name: Scan before/after CVEs with vulnix
        run: |
          mkdir -p "$RUNNER_TEMP/security"
          scan() {
            # vulnix exits 2 when it finds active CVEs; that's expected output,
            # not a scan failure, so only a different nonzero code is fatal.
            set +e
            nix run nixpkgs#vulnix -- --json "$1" > "$2"
            rc=$?
            set -e
            [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || { echo "vulnix exited $rc scanning $1" >&2; exit "$rc"; }
          }
          for host in taractias tariognatha tarmantria; do
            scan "$(jq -r --arg h "$host" '.[$h]' "$RUNNER_TEMP/drvs-before.json")" \
              "$RUNNER_TEMP/security/vulnix-before-$host.json"
            scan "$(jq -r --arg h "$host" '.[$h]' "$RUNNER_TEMP/drvs-after.json")" \
              "$RUNNER_TEMP/security/vulnix-after-$host.json"
          done
      - name: Dry-run build check after update
        run: |
          for host in taractias tariognatha tarmantria; do
            after_drv="$(jq -r --arg h "$host" '.[$h]' "$RUNNER_TEMP/drvs-after.json")"
            nix build --dry-run "${after_drv}^*" > "$RUNNER_TEMP/security/build-after-$host.log" 2>&1 || true
          done
      - name: Render summary
        id: summary
        run: |
          scripts/security-summary.sh "$RUNNER_TEMP/security" taractias tariognatha tarmantria \
            > "$RUNNER_TEMP/security-summary.md"
          echo "critical=$(command cat "$RUNNER_TEMP/security/critical")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-summary
          path: ${{ runner.temp }}/security-summary.md
          retention-days: 7

  pr:
    needs: [update, check, security]
    if: ${{ !cancelled() && needs.update.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: update-summary
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.security.result == 'success'
        with:
          name: security-summary
          path: ${{ runner.temp }}
      - name: Create or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.check.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CRITICAL: ${{ needs.security.outputs.critical }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Update flake inputs'
          if [ "$CRITICAL" = true ]; then
            title="[new CVE] $title"
          fi
          if [ "$RESULT" != success ]; then
            title="[gate failing] $title"
          fi
          case "$RESULT" in
            success) gate='✅ passed' ;;
            failure) gate='❌ failing' ;;
            *) gate="$RESULT" ;;
          esac
          body="$RUNNER_TEMP/body.md"
          {
            echo "Gate: $gate ([run]($RUN_URL))"
            echo
            command cat "$RUNNER_TEMP/summary.md"
            echo
            if [ "$SECURITY_RESULT" = success ]; then
              command cat "$RUNNER_TEMP/security-summary.md"
            else
              echo "Security scan failed ([run]($RUN_URL))"
            fi
            echo
            # shellcheck disable=SC2016 # literal backticks for Markdown
            echo 'CI checks eval only. Before merging, run `gh pr checkout <n> && just switch <host>` on one machine.'
            echo
            echo 'Checks do not appear on this pull request: it is opened with GITHUB_TOKEN, which triggers no workflows. Merging runs the gate on main.'
          } > "$body"
          number=$(gh pr list --head ci/flake-update --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$body"
          else
            gh pr create --head ci/flake-update --base main --title "$title" --body-file "$body"
          fi
