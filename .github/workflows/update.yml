name: update

# Weekly flake update in two lanes, one PR each
# (docs/superpowers/specs/2026-11-23-update-lanes-design.md): servers (stable channel, shared
# inputs, claude-code) and desktops (everything else). update-lane.yml does a lane's work.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      lane:
        description: Lanes to update
        type: choice
        options: [both, servers, desktops]
        default: both
  # A merged lane PR can leave the other lane's PR conflicting on flake.lock: refresh only
  # that lane (scripts/update-select-lanes.sh decides).
  push:
    branches: [main]
    paths:
      - flake.lock
      - 'pkgs/claude-code/**'

# No workflow-level concurrency group: GitHub keeps one pending run per group, so a conflict
# refresh queued behind a running update would silently cancel a pending scheduled run. The
# lane job below takes a group per lane instead.

permissions: {}

jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lanes: ${{ steps.select.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select lanes
        id: select
        env:
          EVENT: ${{ github.event_name }}
          LANE_INPUT: ${{ inputs.lane }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Two steps: a failed command substitution inside echo's argument would not fail the step.
        run: |
          lanes="$(scripts/update-select-lanes.sh)"
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"

  lane:
    needs: select
    if: needs.select.outputs.lanes != '[]'
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.select.outputs.lanes) }}
    # One group per lane: a second run for a lane queues behind the running one instead of
    # racing it on that lane's branches. If a third arrives, it replaces the pending one,
    # which loses nothing: both regenerate the same lane from the latest main.
    concurrency:
      group: update-lane-${{ matrix.lane }}
      cancel-in-progress: false
    # The most any job in update-lane.yml needs; each of its jobs narrows this down.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/update-lane.yml
    with:
      lane: ${{ matrix.lane }}
