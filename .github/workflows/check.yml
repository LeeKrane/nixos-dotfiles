name: check

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_call:
    inputs:
      ref:
        description: Ref to check out; empty means the triggering ref.
        type: string
        default: ''
      force-nvim:
        description: Build the nvim checks regardless of changed paths.
        type: boolean
        default: false
      force-server-pkgs:
        description: Build the server packages regardless of changed paths.
        type: boolean
        default: false

# Under workflow_call, github.ref is the caller's ref (main), so key on
# inputs.ref first; otherwise update.yml's gate would cancel, or be
# cancelled by, the push run on main.
concurrency:
  group: check-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # nixfmt, statix, deadnix, shellcheck, actionlint and the secrets guard;
      # the same script is the pre-push hook (.githooks/pre-push).
      - name: lint
        run: scripts/lint.sh
      - name: check-secrets-encrypted tests
        run: bash scripts/tests/check-secrets-encrypted-test.sh
      - name: flake-update-notify tests
        run: nix shell --inputs-from . nixpkgs#curl nixpkgs#jq nixpkgs#gawk -c bash scripts/tests/flake-update-notify-test.sh
      - name: server-upgrade tests
        run: |
          nix shell --inputs-from . nixpkgs#curl nixpkgs#jq nixpkgs#gawk -c bash scripts/tests/server-upgrade-report-test.sh
          nix shell --inputs-from . nixpkgs#curl nixpkgs#jq nixpkgs#gawk -c bash scripts/tests/server-upgrade-hooks-test.sh
      - name: update-lanes tests
        run: nix shell --inputs-from . nixpkgs#jq -c bash scripts/tests/update-lanes-test.sh
      - name: collapse-hosts tests
        run: nix shell --inputs-from . nixpkgs#jq nixpkgs#gawk -c bash scripts/tests/collapse-hosts-test.sh
      - name: update-select-lanes tests
        run: nix shell --inputs-from . nixpkgs#jq -c bash scripts/tests/update-select-lanes-test.sh
      - name: update-pr-body tests
        run: nix shell --inputs-from . nixpkgs#jq -c bash scripts/tests/update-pr-body-test.sh

  # Same ref as the eval jobs: under workflow_call (update.yml calls this with
  # ref: needs.update.outputs.sha, the exact pushed commit), github.ref is the
  # caller's ref, not inputs.ref.
  hosts:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Compute host list
        id: hosts
        run: |
          # scripts/hosts.nix is the one shared place for this list (x86_64 hosts: the
          # runners cannot build the Pis, which checks.pi-eval only evaluates).
          nix eval --json --impure '.#lib.hostMeta' --apply 'import ./scripts/hosts.nix' > "$RUNNER_TEMP/hosts.json"
          echo "hosts=$(command cat "$RUNNER_TEMP/hosts.json")" >> "$GITHUB_OUTPUT"

  eval:
    needs: hosts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.hosts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # Evaluating a host applies every patch under patches/ (applyPatches
      # imported in lib/mk-host.nix), so upstream drift fails here.
      - name: eval ${{ matrix.host }}
        run: nix eval --raw .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # lua-syntax first: building it realizes the applyPatches sources that
      # lib/mk-host.nix imports (IFD). On a fresh runner store,
      # `flake check --no-build` cannot build them and fails.
      - name: lua-syntax
        run: nix build --no-link .#checks.x86_64-linux.lua-syntax
      - name: flake check
        run: nix flake check --no-build

  nvim:
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's files through the REST API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # paths-filter supports only push and pull_request events; a forced run
      # (update.yml, on schedule/workflow_dispatch) skips it entirely.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ !inputs.force-nvim }}
        with:
          filters: |
            nvim:
              - 'modules/nixvim/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'overlays/**'
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        if: ${{ inputs.force-nvim || steps.filter.outputs.nvim == 'true' }}
      - name: nvim checks
        if: ${{ inputs.force-nvim || steps.filter.outputs.nvim == 'true' }}
        run: nix build --no-link .#checks.x86_64-linux.nvim .#checks.x86_64-linux.nvim-stable .#checks.x86_64-linux.nvim-specs

  # server-upgrade is a writeShellApplication, so it is shellchecked at build
  # time with the stable nixpkgs' shellcheck on the servers' pkgs; the lint job
  # shellchecks with unstable. Building it here catches findings only stable has.
  server-pkgs:
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's files through the REST API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # The servers update lane forces the build; any other run filters on changed paths
      # (on schedule/workflow_dispatch, paths-filter compares against the last commit).
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ !inputs.force-server-pkgs }}
        with:
          filters: |
            server-pkgs:
              - 'pkgs/default.nix'
              - 'pkgs/server-upgrade/**'
              - 'pkgs/claude-code/**'
              - 'scripts/server-upgrade-*.sh'
              - 'flake.lock'
              - 'overlays/**'
              - 'flake.nix'
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        if: ${{ inputs.force-server-pkgs || steps.filter.outputs.server-pkgs == 'true' }}
      - name: server packages
        if: ${{ inputs.force-server-pkgs || steps.filter.outputs.server-pkgs == 'true' }}
        run: nix build --no-link .#nixosConfigurations.taragarmr.pkgs.server-upgrade .#nixosConfigurations.taragarmr.pkgs.claude-code
