creation_rules:
  - path_regex: secrets/tariognatha\.yaml$
    key_groups:
      - age:
          - *admin_tariognatha
          - *host_tariognatha

  - path_regex: secrets/tarmantria\.yaml$
    key_groups:
      - age:
          - *admin_tarmantria
          - *host_tarmantria

  - path_regex: secrets/taractias\.yaml$
    key_groups:
      - age:
          - *admin_taractias
          - *host_taractias

  - path_regex: secrets/taragarmr\.yaml$
    key_groups:
      - age:
          - *admin_tariognatha
          - *admin_tarmantria
          - *host_taragarmr

  - path_regex: secrets/taronychus\.yaml$
    key_groups:
      - age:
          - *admin_tariognatha
          - *admin_tarmantria
          - *host_taronychus

  - path_regex: secrets/tarritator\.yaml$
    key_groups:
      - age:
          - *admin_tariognatha
          - *admin_tarmantria
          - *host_tarritator

  - path_regex: secrets/tarronax\.yaml$
    key_groups:
      - age:
          - *admin_tariognatha
          - *admin_tarmantria
          - *host_tarronax
