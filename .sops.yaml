# sops-nix key/recipient map. See secrets/README.md for what each secret holds.
#
# Each host has two recipients: an admin key, which is that host owner's
# personal age key, and a host key, derived from that host's own SSH host
# key. No single key spans multiple hosts anymore -- every host can decrypt
# only its own secrets/<host>.yaml.
#
# Recipients still following the age1PLACEHOLDER_* naming scheme have not
# been bootstrapped yet. scripts/bootstrap-sops.sh replaces each one with
# the real recipient. Never hand-edit a placeholder recipient here.
keys:
  - &admin_tariognatha age1hxjswupw62ueuwgjtqqmr0nsjef8azjxjlsupqp08ne7nwktsgzqp2qheg
  - &host_tariognatha age1rfjht8hjtknszm2rctp2jw7gr2mchsq7e6nuxvuwqqc92390zg4svewm2m
  - &admin_tarmantria age10yyfd8phl7aprnlea7eqtvqk2aa26y9g8wyses6n06qtz8mh2dcszfg7ps
  - &host_tarmantria age1779675ua8quw2d2shtejxgxz36fekj8ez90a7e7rhngsukj6dcpsqnctlx
  - &admin_taractias age1jwlqpsyazly7u24h5nwegaznc9mlgqnnek0xxn9nksmgxft3pg9sph75al
  - &host_taractias age18ln7hrxrhx59dk5cn4p8d9gndnftkcpyauvfkhttfhphu6kg3adq8q8wsf
  # Servers: no admin key of their own. They are administered from tariognatha and
  # tarmantria, so both of those admin keys are recipients of every server file. Host keys
  # come from SSH host keys pre-generated before install (injected via nixos-anywhere
  # --extra-files or copied onto the SD image), not from bootstrap-sops.sh.
  - &host_taragarmr age1jmqpxrmz20clmnvaufnadxetv3q5ra79zpfhhh9p4sqh9rg8vucs8ck07k
  - &host_taronychus age15wryrqekk749mc9s0dul4qxwt6x7vudeu44x7sex0d3tylggzveqs562w4
  - &host_tarritator age1w486a5exr8rys6krgsgv4vvhss7hzn2an8hmzmfwxs6nwlh23eesr4z479
  - &host_tarronax age1yv39slw5gr04kqm2u4900k8q2vlckph3jl7rat4ejnsnfpm3xg7qz5svtg

creation_rules:
  - path_regex: secrets/tariognatha\.yaml$
    key_groups:
      - age:
          - *admin_tariognatha
          - *host_tariognatha

  - path_regex: secrets/tarmantria\.yaml$
    key_groups:
      - age:
          - *admin_tarmantria
          - *host_tarmantria

  - path_regex: secrets/taractias\.yaml$
    key_groups:
      - age:
          - *admin_taractias
          - *host_taractias

  - path_regex: secrets/taragarmr\.yaml$
    key_groups:
      - age:
          - *admin_tariognatha
          - *admin_tarmantria
          - *host_taragarmr

  - path_regex: secrets/taronychus\.yaml$
    key_groups:
      - age:
          - *admin_tariognatha
          - *admin_tarmantria
          - *host_taronychus

  - path_regex: secrets/tarritator\.yaml$
    key_groups:
      - age:
          - *admin_tariognatha
          - *admin_tarmantria
          - *host_tarritator

  - path_regex: secrets/tarronax\.yaml$
    key_groups:
      - age:
          - *admin_tariognatha
          - *admin_tarmantria
          - *host_tarronax
